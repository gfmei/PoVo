# Original vocabulary-free LLaVA -> Grounding DINO -> SAM pipeline, 50 views.
foundation_model:
  clip_model: ViT-B/32
  clip_dim: 512
  detector_id: IDEA-Research/grounding-dino-tiny
  segmenter_id: facebook/sam-vit-base
  vocabulary_model: llava-hf/llava-v1.6-mistral-7b-hf
  vocabulary_revision: 2424fdd47412fccc66d91719126b420e9fbd7065
  vocabulary_load_in_4bit: true
data:
  img_dim: [640, 480]
  cut_num_pixel_boundary: 10
  depth_scale: 1000.0
  max_frames: 50
clustering:
  cluster_budget: 128
  merge_threshold: 0.5
graph:
  appearance_mode: clip
  radius: 0.2
  window_size: 32
  resolution: 0.01
  chunk_size: 8192
  curve_orders: [morton, hilbert, morton_yzx, hilbert_yzx]
